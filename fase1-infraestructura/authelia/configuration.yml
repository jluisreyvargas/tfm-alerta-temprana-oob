server:
  address: tcp://0.0.0.0:9091/

log:
  level: info

identity_validation:
  reset_password: {}       # el jwt_secret viene de AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET

totp:
  issuer: TFM-OOB-Lab

authentication_backend:
  file:
    path: /config/users_database.yml

access_control:
  default_policy: deny
  rules:
    - domain: 'chat.oob.local'
      subject: 'group:ir_lead'
      policy: two_factor
    - domain: 'hs.oob.local'
      subject: 'group:ir_lead'
      policy: two_factor
    - domain: 'n8n.oob.local'
      resources:
        - '^/webhook/bg-credential.*'
      subject: 'group:ir_lead'
      policy: two_factor

session:
  cookies:
    - domain: oob.local
      authelia_url: https://auth.oob.local
      default_redirection_url: https://chat.oob.local
      expiration: 3600
      inactivity: 1800

storage:
  local:
    path: /config/db.sqlite3

notifier:
  filesystem:
    filename: /config/notification.txt
