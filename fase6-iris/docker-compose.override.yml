services:
  app:
    volumes:
      - ./certificates/rootCA/ca-bundle-oob.crt:/etc/ssl/certs/ca-bundle-oob.crt:ro
    environment:
      - REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-bundle-oob.crt
      - SSL_CERT_FILE=/etc/ssl/certs/ca-bundle-oob.crt
      - CURL_CA_BUNDLE=/etc/ssl/certs/ca-bundle-oob.crt
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/login', timeout=5).status==200 else 1)"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  worker:
    volumes:
      - ./certificates/rootCA/ca-bundle-oob.crt:/etc/ssl/certs/ca-bundle-oob.crt:ro
    environment:
      - REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-bundle-oob.crt
      - SSL_CERT_FILE=/etc/ssl/certs/ca-bundle-oob.crt
      - CURL_CA_BUNDLE=/etc/ssl/certs/ca-bundle-oob.crt

  nginx:
    ports: !override
      - "100.64.0.1:${INTERFACE_HTTPS_PORT:-443}:${INTERFACE_HTTPS_PORT:-443}"
    depends_on:
      app:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=oob-network"
      - "traefik.http.routers.iris.rule=Host(`iris.oob.local`)"
      - "traefik.http.routers.iris.entrypoints=websecure"
      - "traefik.http.routers.iris.tls=true"
      - "traefik.http.routers.iris.service=iris"
      - "traefik.http.routers.iris.middlewares=secure-headers@file,authelia@file"
      - "traefik.http.services.iris.loadbalancer.server.port=4833"
      - "traefik.http.services.iris.loadbalancer.server.scheme=https"

  rabbitmq:
    image: rabbitmq:3.13.7-management-alpine
