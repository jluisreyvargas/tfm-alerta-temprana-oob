services:
  hbbs:
    image: rustdesk/rustdesk-server:1.1.14@sha256:680f8ba5accafc264d15076f33a6fdb9cb6f4d963a0fc92e01023ca0e919cc83
    container_name: rustdesk-hbbs
    command: hbbs -r rustdesk-hbbr:21117 -k _
    restart: unless-stopped
    volumes:
      - ./rustdesk/data:/root
    ports:
      - "${TAILNET_IP}:21115:21115"
      - "${TAILNET_IP}:21116:21116"
      - "${TAILNET_IP}:21116:21116/udp"
      - "${TAILNET_IP}:21118:21118"
    networks:
      - oob-network

  hbbr:
    image: rustdesk/rustdesk-server:1.1.14@sha256:680f8ba5accafc264d15076f33a6fdb9cb6f4d963a0fc92e01023ca0e919cc83
    container_name: rustdesk-hbbr
    command: hbbr -k _
    restart: unless-stopped
    volumes:
      - ./rustdesk/data:/root
    ports:
      - "${TAILNET_IP}:21117:21117"
      - "${TAILNET_IP}:21119:21119"
    networks:
      - oob-network

networks:
  oob-network:
    external: true
