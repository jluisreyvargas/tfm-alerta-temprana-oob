services:
  headscale:
    image: docker.io/headscale/headscale:0.28.0
    container_name: headscale
    restart: unless-stopped
    command: serve
    tmpfs:
      - /var/run/headscale
    volumes:
      - /home/jose/tfm-alerta-temprana-oob/fase4-breakglass-dc/headscale/config:/etc/headscale
      - /home/jose/tfm-alerta-temprana-oob/fase4-breakglass-dc/headscale/lib:/var/lib/headscale
    ports:
      - "8090:8080"
      - "9090:9090"
    networks:
      - oob-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.headscale.rule=Host(`hs.oob.local`)"
      - "traefik.http.routers.headscale.entrypoints=websecure"
      - "traefik.http.routers.headscale.tls=true"
      - "traefik.http.services.headscale.loadbalancer.server.port=8080"
      - "traefik.docker.network=oob-network"

networks:
  oob-network:
    external: true