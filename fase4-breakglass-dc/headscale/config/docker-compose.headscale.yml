services:
  headscale:
    image: docker.io/headscale/headscale:0.28.0@sha256:51b1b9182bb6219e97374fa89af6b9320d6f87ecc739e328d5357ea4fa7a5ce3
    container_name: headscale
    restart: unless-stopped
    command: serve
    tmpfs:
      - /var/run/headscale
    volumes:
      - ./:/etc/headscale
      - ../lib:/var/lib/headscale
    ports:
      - "127.0.0.1:8090:8080"   # fallback de diagnóstico, no acceso normal
      - "3478:3478/udp"         # STUN del DERP embebido
    networks:
      - oob-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.headscale.rule=Host(`hs.oob.local`)"
      - "traefik.http.routers.headscale.entrypoints=websecure"
      - "traefik.http.routers.headscale.tls=true"
      - "traefik.http.services.headscale.loadbalancer.server.port=8080"
      - "traefik.docker.network=oob-network"

networks:
  oob-network:
    external: true
