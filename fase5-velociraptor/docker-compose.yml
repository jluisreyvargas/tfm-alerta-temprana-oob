services:
  velociraptor:
    build:
      context: ./velociraptor-image
      args:
        VELOX_VERSION: "0.76.6"
    image: velociraptor-oob:0.76.6
    container_name: velociraptor
    ports:
      - "8001:8001"
      - "8889:8889"
    volumes:
      - ./velociraptor-config:/velociraptor
    restart: unless-stopped
    networks:
      - oob-network

  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - oob-network

  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BUCKET: ${MINIO_BUCKET:-evidence}
    volumes:
      - ./init-minio-bucket.sh:/init-minio-bucket.sh:ro
    entrypoint: ["/bin/sh", "/init-minio-bucket.sh"]
    restart: "no"
    networks:
      - oob-network

volumes:
  minio_data:

networks:
  oob-network:
    external: true