services:
  velociraptor:
    build:
      context: ./velociraptor-image
      args:
        VELOX_VERSION: "0.76.6"
    image: velociraptor-oob:0.76.6
    container_name: velociraptor
    ports:
      - "8001:8001"
      - "8889:8889"
    volumes:
      - ./velociraptor-config:/velociraptor
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=oob-network"
      - "traefik.http.routers.velociraptor.rule=Host(`velociraptor.oob.local`)"
      - "traefik.http.routers.velociraptor.entrypoints=websecure"
      - "traefik.http.routers.velociraptor.tls=true"
      - "traefik.http.routers.velociraptor.service=velociraptor"
      - "traefik.http.routers.velociraptor.middlewares=secure-headers@file"
      - "traefik.http.services.velociraptor.loadbalancer.server.port=8889"
      - "traefik.http.services.velociraptor.loadbalancer.server.scheme=https"
    networks:
      - oob-network

  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    ports:
      # 9001 (consola) retirado en el P1-1a Fase B: se sirve por
      # https://minio.oob.local a traves de Traefik, con secure-headers y Authelia.
      # 9000 (API S3) se conserva: lo consume el orchestrator por DNS interno
      # de Docker (MINIO_ENDPOINT=minio:9000). Se trata en el P1-1b.
      - "9000:9000"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER no definido, crear .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD no definido, crear .env}
      MINIO_BUCKET: ${MINIO_BUCKET:-evidence}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=oob-network"
      - "traefik.http.routers.minio.rule=Host(`minio.oob.local`)"
      - "traefik.http.routers.minio.entrypoints=websecure"
      - "traefik.http.routers.minio.tls=true"
      - "traefik.http.routers.minio.service=minio"
      - "traefik.http.routers.minio.middlewares=secure-headers@file,authelia@file"
      - "traefik.http.services.minio.loadbalancer.server.port=9001"
    networks:
      - oob-network

  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER no definido, crear .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD no definido, crear .env}
      MINIO_BUCKET: ${MINIO_BUCKET:-evidence}
    volumes:
      - ./init-minio-bucket.sh:/init-minio-bucket.sh:ro
    entrypoint: ["/bin/sh", "/init-minio-bucket.sh"]
    restart: on-failure
    networks:
      - oob-network

volumes:
  minio_data:

networks:
  oob-network:
    external: true
